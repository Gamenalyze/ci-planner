name: CI Planner
description: Free, conservative pull request plans with shadow mode and run-all fallback.
author: GameAnalyze
branding:
  icon: git-pull-request
  color: blue
inputs:
  base:
    description: Full trusted base commit SHA (must be fetched).
    required: true
  head:
    description: Full PR head commit SHA (must be fetched).
    required: true
  merge:
    description: Tested merge SHA with exact base/head parents; needed to enforce skips.
    default: ""
  workflow:
    description: Workflow path whose job IDs are exported.
    required: true
  repository-path:
    description: Path to the source checkout.
    default: "."
  enforce:
    description: Request skips (also requires base policy opt-in and verified merge).
    default: "false"
  summary:
    description: Append a readable plan to the GitHub job summary; does not post PR comments.
    default: "true"
  audit-repository:
    description: Include static missing-check evidence in the report without changing plan decisions.
    default: "false"
  validation-input:
    description: Optional trusted skip-validation report path; missing or unsafe evidence forces a full run.
    default: ""
outputs:
  run:
    description: JSON object mapping job IDs to run booleans.
    value: ${{ steps.plan.outputs.run }}
  ready:
    description: True only after successful planning; consumers must run on any other value.
    value: ${{ steps.plan.outputs.ready }}
  plan-hash:
    description: Digest binding inputs and decisions to this plan.
    value: ${{ steps.plan.outputs.plan_hash }}
  mode:
    description: shadow or enforce.
    value: ${{ steps.plan.outputs.mode }}
runs:
  using: composite
  steps:
    - name: Check the caller Node runtime
      id: runtime
      shell: bash
      run: |
        if command -v node >/dev/null 2>&1 && node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)' >/dev/null 2>&1; then
          echo "supported=true" >> "$GITHUB_OUTPUT"
        else
          echo "supported=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up the supported Action runtime
      if: steps.runtime.outputs.supported != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: "24"
        package-manager-cache: false
    - name: Install the pinned parser without lifecycle scripts
      shell: bash
      run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"
    - name: Plan from committed inputs
      id: plan
      shell: bash
      env:
        PLANNER_ROOT: ${{ inputs.repository-path }}
        PLANNER_BASE: ${{ inputs.base }}
        PLANNER_HEAD: ${{ inputs.head }}
        PLANNER_MERGE: ${{ inputs.merge }}
        PLANNER_WORKFLOW: ${{ inputs.workflow }}
        PLANNER_ENFORCE: ${{ inputs.enforce }}
        PLANNER_SUMMARY: ${{ inputs.summary }}
        PLANNER_AUDIT: ${{ inputs.audit-repository }}
        PLANNER_VALIDATION: ${{ inputs.validation-input }}
      run: |
        args=(plan --root "$PLANNER_ROOT" --repository "$GITHUB_REPOSITORY" --base "$PLANNER_BASE" --head "$PLANNER_HEAD" --event "$GITHUB_EVENT_NAME" --workflow "$PLANNER_WORKFLOW" --github-output)
        if [[ -n "$PLANNER_MERGE" ]]; then args+=(--merge "$PLANNER_MERGE"); fi
        if [[ "$PLANNER_ENFORCE" == true ]]; then args+=(--enforce); fi
        if [[ "$PLANNER_SUMMARY" == true ]]; then args+=(--summary); fi
        if [[ "$PLANNER_AUDIT" == true ]]; then args+=(--audit-repo); fi
        if [[ -n "$PLANNER_VALIDATION" ]]; then args+=(--validation-input "$PLANNER_VALIDATION"); fi
        node "$GITHUB_ACTION_PATH/bin/ci-planner.mjs" "${args[@]}"
