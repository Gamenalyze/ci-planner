name: Publish CI Planner
on:
  workflow_run:
    workflows: [CI Planner]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: Successful main push CI run ID to retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-planner-publish
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'Gamenalyze/ci-planner' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish verified version and check Marketplace
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CI_RUN_ID: ${{ inputs.ci-run-id }}
        run: node scripts/release.mjs

  publish-npm:
    needs: publish
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - name: Publish matching release bytes through npm trusted publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/publish-npm.mjs
