name: CI Planner
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-planner-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run sbom:check
      - run: npm run check
  validate:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install verified CI scanners
        shell: bash
        run: |
          tools_dir="$RUNNER_TEMP/ci-planner-tools"
          mkdir -p "$tools_dir"
          curl -fsSL --retry 3 --max-time 60 -o "$tools_dir/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tools_dir/actionlint.tgz" | sha256sum --check --strict
          tar -xzf "$tools_dir/actionlint.tgz" -C "$tools_dir" actionlint
          curl -fsSL --retry 3 --max-time 60 -o "$tools_dir/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tools_dir/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$tools_dir/gitleaks.tgz" -C "$tools_dir" gitleaks
          echo "$tools_dir" >> "$GITHUB_PATH"
      - run: actionlint .github/workflows/*.yml examples/*.yml
      - run: gitleaks dir . --redact --no-banner
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --version
      - run: npm run check
      - run: npm test
      - run: npm run consumer:smoke
      - run: npm audit --omit=dev --audit-level=high
      - name: Exercise the shipped Action against this repository
        uses: ./
        id: self-plan
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          workflow: .github/workflows/ci.yml
          enforce: "false"
          audit-repository: "true"
      - name: Verify Action outputs and run completeness audit
        env:
          EXPECTED_NODE: ${{ matrix.node }}
          PLANNER_READY: ${{ steps.self-plan.outputs.ready }}
          PLANNER_MODE: ${{ steps.self-plan.outputs.mode }}
          PLANNER_RUN: ${{ steps.self-plan.outputs.run }}
        run: |
          node -e 'require("node:assert/strict").equal(process.versions.node.split(".")[0], process.env.EXPECTED_NODE);'
          node -e 'const assert = require("node:assert/strict"); assert.equal(process.env.PLANNER_READY, "true"); assert.equal(process.env.PLANNER_MODE, "shadow"); assert.equal(JSON.parse(process.env.PLANNER_RUN).validate, true);'
          node bin/ci-planner.mjs audit-repo --root . > "$RUNNER_TEMP/ci-completeness.json"
      - name: Smoke-test the distributable
        shell: bash
        run: |
          task_dir=$(mktemp -d)
          npm pack --ignore-scripts --pack-destination "$task_dir"
          npm install --offline --ignore-scripts --no-audit --no-fund --prefix "$task_dir/install" "$task_dir"/*.tgz
          "$task_dir/install/node_modules/.bin/ci-planner" --version
          "$task_dir/install/node_modules/.bin/ci-planner" init --root "$GITHUB_WORKSPACE" --action-ref "$GITHUB_SHA" --format markdown > "$task_dir/setup.md"
          "$task_dir/install/node_modules/.bin/ci-planner" fix --root "$GITHUB_WORKSPACE" --format markdown > "$task_dir/fix.md"
          "$task_dir/install/node_modules/.bin/ci-planner" audit-repo --root "$GITHUB_WORKSPACE" > "$task_dir/audit.json"
          "$task_dir/install/node_modules/.bin/ci-planner" report --input "$task_dir/audit.json" > "$task_dir/audit.md"
          grep -q 'Repository checks' "$task_dir/audit.md"
          "$task_dir/install/node_modules/.bin/ci-planner" discover --root "$GITHUB_WORKSPACE" --format markdown > "$task_dir/dependencies.md"
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({schemaVersion:1, repository:"Gamenalyze/ci-planner", runs:[]}))' "$task_dir/snapshot.json"
          "$task_dir/install/node_modules/.bin/ci-planner" advise --input "$task_dir/snapshot.json" --format markdown > "$task_dir/advice.md"
          "$task_dir/install/node_modules/.bin/ci-planner" reuse --root "$GITHUB_WORKSPACE" --repository Gamenalyze/ci-planner --target "$GITHUB_SHA" --input "$task_dir/missing-receipt.json" --environment "$(node -e 'process.stdout.write("0".repeat(64))')" > "$task_dir/reuse.json"
          node -e 'require("node:assert/strict").equal(require(process.argv[1]).run, true)' "$task_dir/reuse.json"
