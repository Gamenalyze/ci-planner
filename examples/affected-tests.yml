name: Affected tests with run-all fallback
on: pull_request
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      ready: ${{ steps.select.outputs.ready }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npx --yes @gamenalyze/ci-planner@0.5.0 affected --base "$BASE_SHA" --runner vitest --github-output
  tests:
    needs: select
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.result == 'success' && needs.select.outputs.ready == 'true' && needs.select.outputs.matrix || '{"include":[{"schemaVersion":1,"mode":"affected-tests-advisory","runner":"vitest","runAll":true,"tests":[]}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Copy the reviewed examples/run-affected-tests.mjs into your repository first.
      - env:
          CI_PLANNER_SELECTION: ${{ toJSON(matrix) }}
          TEST_RUNNER: vitest
        run: node examples/run-affected-tests.mjs
